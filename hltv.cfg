// ==========================================
// MAX-QUALITY HLTV CONFIGURATION
// ==========================================

name "HLTV | Ultra HD Recording"
hostname "HLTV Server"

// ارسال و دریافت داده با بالاترین ظرفیت شبکه
updaterate 102
maxrate 100000
lowrate 50000
chatrate 100

// کیفیت ضبط دمو
record 1
blockvoice 1             // قطع وویس برای آزاد شدن تمام پهنای باند شبکه جهت ثبت دقیق تیرها و حرکتها
delay 0                  // حذف تاخیر زمانی (صفر کردن Delay Buffer روی کلینت)

// تنظیمات اسپکتور و دوربین
chasecam 1
autocam 1
sendspec 1
maxclients 1             // محدود کردن بیننده‌ها تا تمام پردازش صرف ضبط فایل دمو شود

autoreconnect 1
connect "185.236.38.83:27015"
