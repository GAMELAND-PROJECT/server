// GameLand LAN Host Performance Profile
// Local client-side settings for smooth New Game / LAN hosting.

echo ">> GAMELAND LAN HOST PROFILE LOADED"

developer "0"
fps_max "101"
fps_modem "0"

rate "100000"
cl_cmdrate "101"
cl_updaterate "101"
ex_interp "0.01"

net_graph "0"
cl_showfps "0"

mp_decals "0"
r_decals "0"
max_shells "0"
max_smokepuffs "0"
cl_weather "0"
fastsprites "2"

gl_cull "1"
gl_keeptjunctions "0"
gl_lightholes "0"
gl_round_down "3"
gl_picmip "2"
gl_max_size "256"
gl_texturemode "GL_LINEAR_MIPMAP_NEAREST"
gl_wateramp "0"
r_detailtextures "0"
r_dynamic "0"
r_mmx "1"
r_novis "0"
cl_himodels "0"

violence_ablood "0"
violence_agibs "0"
violence_hblood "0"
violence_hgibs "0"

alias gl_lan_perf "mp_decals 0; r_decals 0; max_shells 0; max_smokepuffs 0; cl_weather 0; fastsprites 2; gl_cull 1; gl_keeptjunctions 0; gl_lightholes 0; gl_round_down 3; gl_picmip 2; gl_max_size 256; gl_texturemode GL_LINEAR_MIPMAP_NEAREST; gl_wateramp 0; r_detailtextures 0; r_dynamic 0; r_novis 0; cl_himodels 0; violence_ablood 0; violence_agibs 0; violence_hblood 0; violence_hgibs 0; developer 0; echo GL LAN PERF"
alias gl_lan_quality "mp_decals 96; r_decals 96; max_shells 20; max_smokepuffs 20; cl_weather 1; fastsprites 0; gl_round_down 0; gl_picmip 0; gl_max_size 512; gl_texturemode GL_LINEAR_MIPMAP_LINEAR; r_dynamic 1; echo GL LAN QUALITY"
alias gl_lan_debug "developer 1; net_graph 3; cl_showfps 1; gl_lan_status"
