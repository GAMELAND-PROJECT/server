// GameLand LAN Host Performance Profile
// Local client-side settings for smooth New Game / LAN hosting.

echo ">> GAMELAND LAN HOST PROFILE LOADED"

developer "0"
fps_max "101"
fps_modem "0"

rate "100000"
cl_cmdrate "101"
cl_updaterate "101"
ex_interp "0.01"

net_graph "0"
cl_showfps "0"

mp_decals "32"
r_decals "32"
max_shells "0"
max_smokepuffs "0"
cl_weather "0"
fastsprites "2"

violence_ablood "1"
violence_agibs "0"
violence_hblood "1"
violence_hgibs "0"

alias gl_lan_perf "mp_decals 16; r_decals 16; max_shells 0; max_smokepuffs 0; cl_weather 0; fastsprites 2; developer 0; echo GL LAN PERF"
alias gl_lan_quality "mp_decals 96; r_decals 96; max_shells 20; max_smokepuffs 20; cl_weather 1; fastsprites 0; echo GL LAN QUALITY"
alias gl_lan_debug "developer 1; net_graph 3; cl_showfps 1; gl_lan_status"
