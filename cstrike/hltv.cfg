// GAMELAND HLTV Proxy Configuration
// Optimized for match demo recording (ReHLDS)

name "HLTV"
hostname "GAMELAND MIX HLTV"

// Security & Control
adminpassword "gameland_hltv_secure"

// Performance & Recording Options
maxclients 0            // 0 spectator slots: reserves 100% CPU and network resources for demo file writing
delay 0                 // 0 delay for instant match-end demo finalization without cutting off
chatmode 2              // 2 = Record & broadcast ALL in-game player chat, team chat, and server messages
blockvoice 0            // 0 = Record player voice communications
nomaster 1              // Do not register at Valve master servers
logfile 0               // Disable proxy disk logging to maximize disk write speed

// Network Rates
rate 100000             // Maximum bandwidth allocation
updaterate 100          // 100 updates/sec to match server tickrate

// Connection settings
autoretry 1
connect "127.0.0.1:27015"

