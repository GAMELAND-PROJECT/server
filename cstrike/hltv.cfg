// GAMELAND HLTV Configuration

// serverpassword "" // if the server has a password, set it here so HLTV can connect
adminpassword "gameland_hltv_secure" // Password for AMXX to control HLTV via RCON
name "HLTV"
hostname "GAMELAND MIX HLTV"

delay 0 // 0 delay for instant demo recording without buffer lag
maxclients 10 // How many spectators can connect directly to HLTV (0 to disable)
developer 0
// rate settings
rate 100000
updaterate 101
nomaster 1
// log on
cl_lw 1
cl_lc 1
sv_alltalk 1
sv_cmdrate 101
sv_maxcmdrate 101
sv_mincmdrate 101
sv_maxupdaterate 101
sv_minupdaterate 101
fps_max 101
// Chat settings
chatmode 1

// Connection settings
autoretry 1
connect "127.0.0.1:27015"
