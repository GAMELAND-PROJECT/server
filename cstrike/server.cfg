// ============================================================
// GameLand BasePack
// Main Server Configuration
// ============================================================

hostname "GameLand CS 1.6 #1 (Competitive)"

// --- Network & Tickrate Tuning ---
sys_ticrate 10000
sv_maxrate 100000
sv_minrate 50000
sv_maxupdaterate 102
sv_minupdaterate 100

// --- Spectator & Camera Settings ---
mp_forcechasecam 0
mp_forcecamera 0
mp_fadetoblack 0

// --- ReHLDS Optimizations ---
rehlds_movevars_transmit_all 1
rehlds_maxucommsgap 5

// --- AFK & Idle Protection ---
gameland_afk_guard 1
mp_autokick 0

// --- Semiclip & Slots ---
sv_visiblemaxplayers 10
mp_semiclip 0
mp_semiclip_actions 0

exec rehlds.cfg
exec gameland.cfg
